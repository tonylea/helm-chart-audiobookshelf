suite: PersistentVolumeClaims
release:
  name: audiobookshelf
templates:
  - templates/persistentvolumeclaims.yaml
tests:
  - it: claims 1Gi for config and 5Gi for metadata, each ReadWriteOnce
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: audiobookshelf-config
        documentIndex: 0
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
        documentIndex: 0
      - equal:
          path: metadata.name
          value: audiobookshelf-metadata
        documentIndex: 1
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
        documentIndex: 1
      - equal:
          path: spec.accessModes
          value: [ReadWriteOnce]

  - it: leaves the class to the cluster's default unless one is named
    asserts:
      - notExists:
          path: spec.storageClassName

  - it: uses the class it's given
    set:
      persistence.config.storageClassName: fast
      persistence.metadata.storageClassName: bulk
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast
        documentIndex: 0
      - equal:
          path: spec.storageClassName
          value: bulk
        documentIndex: 1
