apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audiobookshelf.labels" . | nindent 4 }}
spec:
  # SQLite allows one server, and the claims are ReadWriteOnce, so the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "audiobookshelf.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "audiobookshelf.labels" . | nindent 8 }}
    spec:
      # The image runs as root and has no setting for another user, so it can write library folders whoever owns them.
      containers:
        - name: audiobookshelf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - name: http
              containerPort: 80
          # Database migrations run before the server listens, so a first start after an upgrade gets 5 minutes.
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: metadata
              mountPath: /metadata
            {{- range .Values.libraries }}
            - name: {{ printf "library-%s" .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ .readOnly | default false }}
            {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ printf "%s-config" .Release.Name }}
        - name: metadata
          persistentVolumeClaim:
            claimName: {{ printf "%s-metadata" .Release.Name }}
        {{- range .Values.libraries }}
        - name: {{ printf "library-%s" .name }}
          {{- toYaml .volume | nindent 10 }}
        {{- end }}
